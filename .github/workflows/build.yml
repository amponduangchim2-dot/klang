name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key from secrets
        env:
          KS_B64: ${{ secrets.KLANG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.jks
            echo "Signing with the release key."
          else
            echo "::warning::No signing secrets yet: the APK is unsigned. Add KLANG_KEYSTORE_B64, KLANG_KEYSTORE_PASSWORD and KLANG_KEY_ALIAS in Settings > Secrets and variables > Actions."
          fi

      - name: Build
        env:
          KLANG_KEYSTORE_PASSWORD: ${{ secrets.KLANG_KEYSTORE_PASSWORD }}
          KLANG_KEY_ALIAS: ${{ secrets.KLANG_KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -80 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Read version
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          rm -f app/release.jks
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/klang.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: klang-apk
          path: out/klang.apk

      - name: Publish as the "latest" download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Klang ${{ steps.ver.outputs.name }}
          prerelease: true
          make_latest: false
          files: out/klang.apk
          body: |
            Newest build of Klang from commit ${{ github.sha }}.
            versionName: ${{ steps.ver.outputs.name }}
            versionCode: ${{ steps.ver.outputs.code }}
            On your phone: download klang.apk and open it to install.
