name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/klang.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: klang-apk
          path: out/klang.apk

      - name: Publish as the "latest" download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Klang (latest build)
          prerelease: true
          make_latest: false
          files: out/klang.apk
          body: |
            Newest build of Klang from commit ${{ github.sha }}.
            On your phone: download klang.apk and open it to install.
